
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - 2025:2025
    environment:
      - PYTHONUNBUFFERED=1
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - DATABRICKS_HOST=${DATABRICKS_HOST}
      

  # caddy:
